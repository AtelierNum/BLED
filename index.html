<!doctype html>
<html>
  <head>
    <title>ESP32 WebBLE Control</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        padding: 50px;
        background: #f4f4f9;
      }
      button {
        padding: 15px 25px;
        font-size: 18px;
        cursor: pointer;
        border-radius: 8px;
        border: none;
        margin: 10px;
        transition: 0.3s;
      }
      .connect {
        background: #007bff;
        color: white;
      }
      .on {
        background: #28a745;
        color: white;
      }
      .off {
        background: #dc3545;
        color: white;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      #status {
        margin-top: 20px;
        font-weight: bold;
        color: #555;
      }
      .zone {
        max-width: 640px;
        margin: 30px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #fafafa;
      }
      .zone h2 {
        margin: 0 0 15px;
        font-size: 18px;
        color: #333;
        border-bottom: 2px solid #007bff;
        padding-bottom: 8px;
      }
      #connection {
        text-align: center;
      }
      #manual {
        text-align: center;
      }
      #timeline {
      }
      #timeline button {
        padding: 8px 16px;
        font-size: 15px;
      }
      #tlBar {
        position: relative;
        height: 40px;
        margin: 15px 0 5px;
        background: #ddd;
        border-radius: 6px;
        cursor: crosshair;
        overflow: hidden;
      }
      .tlSeg {
        position: absolute;
        top: 0;
        bottom: 0;
        pointer-events: none;
      }
      .tlMark {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 3px;
        margin-left: -1.5px;
        background: #fff;
        box-shadow: 0 0 0 1px #333;
        pointer-events: none;
      }
      .tlKey .fixed {
        display: inline-block;
        width: 70px;
        font-size: 13px;
        color: #888;
      }
      #tlHead {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        margin-left: -1px;
        background: #dc3545;
        pointer-events: none;
      }
      .hint {
        margin: 0 0 10px;
        font-size: 13px;
        color: #888;
      }
      .tlKey {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      .tlKey input[type="number"] {
        width: 70px;
      }
      .tlKey button {
        padding: 4px 10px;
        font-size: 13px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>ESP32 WebBLE Trigger</h1>

    <div id="connection" class="zone">
      <h2>Connection</h2>
      <button id="connectBtn" class="connect">Connect to ESP32</button>
      <div id="status">Status: Disconnected</div>
    </div>

    <div id="manual" class="zone">
      <h2>Manual</h2>
      <div>
        <button id="onBtn" class="on" disabled>ON</button>
        <button id="offBtn" class="off" disabled>OFF</button>
      </div>
      <h3>State</h3>
      <div id="anims" style="margin: 15px 0"></div>
      <h3>Color</h3>
      <div>
        <input type="color" name="fill" id="fill" value="#007800" onchange="changeFill(event)" disabled />
        <label>
          Fade (ms):
          <input type="number" id="fade" value="500" min="0" step="100" style="width: 70px" />
        </label>
      </div>
    </div>

    <div id="timeline" class="zone">
      <h2>Timeline</h2>
      <label>
        Length (s):
        <input type="number" id="tlLength" value="10" min="1" step="1" />
      </label>
      <button id="tlPlay" disabled>Play</button>
      <button id="tlStop" disabled>Stop</button>
      <label><input type="checkbox" id="tlLoop" /> Loop</label>

      <div id="tlBar"><div id="tlHead"></div></div>
      <p class="hint">
        Click the bar to add a keyframe. Each keyframe holds the color at that
        moment; the segment after it fades to the next color while running its
        animation.
      </p>
      <div id="tlKeys"></div>
    </div>

    <script>
      // Use the same UUIDs as the ESP32 code
      const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
      const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

      const animations = ["solid", "chaser", "noise", "sin"];

      let device;
      let server;
      let service;
      let characteristic;
      let fillCharacteristic;
      let animCharacteristic;

      const connectBtn = document.getElementById("connectBtn");
      const onBtn = document.getElementById("onBtn");
      const offBtn = document.getElementById("offBtn");
      const statusMsg = document.getElementById("status");

      connectBtn.addEventListener("click", async () => {
        try {
          statusMsg.innerText = "Scanning...";
          device = await navigator.bluetooth.requestDevice({
            filters: [{ name: "ESP32_BLE_Trigger" }],
            optionalServices: [SERVICE_UUID],
          });

          statusMsg.innerText = "Connecting to GATT Server...";
          server = await device.gatt.connect();

          statusMsg.innerText = "Getting Service...";
          service = await server.getPrimaryService(SERVICE_UUID);

          statusMsg.innerText = "Getting Characteristic...";
          characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
          fillCharacteristic = await service.getCharacteristic(
            "154f969f-5195-4552-9aba-85922a7ba713",
          );
          animCharacteristic = await service.getCharacteristic(
            "4a9163c8-45ae-42a9-a7d7-e26485ca83e7",
          );

          statusMsg.innerText = "Connected!";
          setControlsEnabled(true);

          device.addEventListener("gattserverdisconnected", () => {
            statusMsg.innerText = "Disconnected";
            setControlsEnabled(false);
          });
        } catch (error) {
          console.log(error);
          statusMsg.innerText = "Error: " + error;
        }
      });

      for (let i = 0; i < animations.length; i++) {
        document
          .querySelector("#anims")
          .insertAdjacentHTML(
            "beforeend",
            `<button onclick="sendAnim(${i})" disabled>${animations[i]}</button>`,
          );
      }

      // Enable/disable every control that needs an active connection
      function setControlsEnabled(enabled) {
        if (!enabled) stopTimeline();
        onBtn.disabled = !enabled;
        offBtn.disabled = !enabled;
        document.getElementById("fill").disabled = !enabled;
        document
          .querySelectorAll("#anims button")
          .forEach((btn) => (btn.disabled = !enabled));
        tlPlayBtn.disabled = !enabled;
        connectBtn.disabled = enabled;
      }

      // Web Bluetooth rejects a write while another is in flight,
      // so every write goes through this chain, one after the other
      let writeChain = Promise.resolve();
      function queueWrite(char, bytes) {
        if (!char) return;
        writeChain = writeChain
          .then(() => char.writeValue(new Uint8Array(bytes)))
          .catch((err) => console.log(err));
      }

      function sendValue(val) {
        queueWrite(characteristic, [val]);
        console.log("Sent: " + val);
      }

      // "#rrggbb" -> [r, g, b]
      function hexToRgb(color) {
        return [
          parseInt(color.substr(1, 2), 16),
          parseInt(color.substr(3, 2), 16),
          parseInt(color.substr(5, 2), 16),
        ];
      }

      // Sends a target color and how long (ms) the ESP32 should take to fade
      // to it. Payload: [r, g, b, durationHi, durationLo]
      function sendFill(color, durationMs = 0) {
        const d = Math.min(65535, Math.max(0, Math.round(durationMs)));
        queueWrite(fillCharacteristic, [...hexToRgb(color), d >> 8, d & 0xff]);
      }

      function changeFill(ev) {
        const fade = parseInt(document.getElementById("fade").value) || 0;
        sendFill(ev.target.value, fade);
      }

      function sendAnim(animIndex) {
        queueWrite(animCharacteristic, [animIndex]);
      }

      // --- TIMELINE ---
      // A keyframe holds the color AT a given time (in seconds). The segment
      // between two keyframes runs the first one's animation while the ESP32
      // fades from the first color to the second; we only tell it when to switch.
      // The first and last keyframes are pinned to the start and end of the
      // timeline: they can't be removed or moved, only recolored.
      let tlLength = 10; // seconds
      let nextKeyId = 0;
      let keyframes = [
        // { id, time, anim, color: "#rrggbb", fixed?: "start" | "end" }
        { id: nextKeyId++, time: 0, anim: 0, color: "#007800", fixed: "start" },
        { id: nextKeyId++, time: tlLength, anim: 0, color: "#007800", fixed: "end" },
      ];

      let tlPlaying = false;
      let tlStart = 0; // performance.now() when the current pass started
      let tlNext = 0; // index of the next keyframe to fire (keyframes sorted)
      let tlRaf = null;

      const tlLengthInput = document.getElementById("tlLength");
      const tlPlayBtn = document.getElementById("tlPlay");
      const tlStopBtn = document.getElementById("tlStop");
      const tlLoop = document.getElementById("tlLoop");
      const tlBar = document.getElementById("tlBar");
      const tlHead = document.getElementById("tlHead");
      const tlKeys = document.getElementById("tlKeys");

      // Sort by time, with the pinned start/end keyframes always at the ends
      function sortKeyframes() {
        const rank = (k) => (k.fixed === "start" ? -1 : k.fixed === "end" ? 1 : 0);
        keyframes.sort((a, b) => a.time - b.time || rank(a) - rank(b));
      }

      // [r, g, b] 0..255 -> [h 0..360, s 0..1, v 0..1]
      function rgbToHsv([r, g, b]) {
        r /= 255; g /= 255; b /= 255;
        const mx = Math.max(r, g, b);
        const mn = Math.min(r, g, b);
        const d = mx - mn;
        let h = 0;
        if (d > 0) {
          if (mx === r) h = ((g - b) / d + 6) % 6;
          else if (mx === g) h = (b - r) / d + 2;
          else h = (r - g) / d + 4;
          h *= 60;
        }
        return [h, mx === 0 ? 0 : d / mx, mx];
      }

      function hsvToHex([h, s, v]) {
        const f = (n) => {
          const k = (n + h / 60) % 6;
          return v - v * s * Math.max(0, Math.min(k, 4 - k, 1));
        };
        return (
          "#" +
          [f(5), f(3), f(1)]
            .map((x) => Math.round(x * 255).toString(16).padStart(2, "0"))
            .join("")
        );
      }

      // Color the strip would show at `time`. Mirrors the ESP32: HSV, shortest
      // hue arc, and grey/black endpoints borrow the other end's hue
      function colorAt(time) {
        sortKeyframes();
        let i = 0;
        while (i < keyframes.length - 2 && keyframes[i + 1].time <= time) i++;
        const a = keyframes[i];
        const b = keyframes[i + 1];
        const span = b.time - a.time;
        const t = span > 0 ? Math.min(1, Math.max(0, (time - a.time) / span)) : 0;

        const ha = rgbToHsv(hexToRgb(a.color));
        const hb = rgbToHsv(hexToRgb(b.color));
        if (hb[1] === 0 || hb[2] === 0) hb[0] = ha[0];
        if (ha[1] === 0 || ha[2] === 0) ha[0] = hb[0];
        let dh = hb[0] - ha[0];
        if (dh > 180) dh -= 360;
        if (dh < -180) dh += 360;

        return hsvToHex([
          (ha[0] + dh * t + 360) % 360,
          ha[1] + (hb[1] - ha[1]) * t,
          ha[2] + (hb[2] - ha[2]) * t,
        ]);
      }

      function renderTimeline() {
        sortKeyframes();

        tlBar.querySelectorAll(".tlSeg, .tlMark").forEach((m) => m.remove());
        const pct = (t) => (t / tlLength) * 100;

        // One gradient rectangle per segment, drawn behind the playhead.
        // "in hsl shorter hue" makes the preview sweep hue the way the ESP32
        // does (CSS has no HSV, but the hue path is the same)
        for (let i = 0; i < keyframes.length - 1; i++) {
          const a = keyframes[i];
          const b = keyframes[i + 1];
          tlBar.insertAdjacentHTML(
            "afterbegin",
            `<div class="tlSeg" style="left:${pct(a.time)}%; width:${pct(b.time - a.time)}%;
              background: linear-gradient(to right in hsl shorter hue, ${a.color}, ${b.color})"
              title="${a.time}s → ${b.time}s: ${animations[a.anim]}"></div>`,
          );
        }

        // Keyframe markers on top
        for (const k of keyframes) {
          tlBar.insertAdjacentHTML(
            "beforeend",
            `<div class="tlMark" style="left:${pct(k.time)}%" title="${k.time}s ${k.color}"></div>`,
          );
        }

        // One editable row per keyframe. Pinned ones can't be moved or removed,
        // and the end keyframe has no animation since nothing runs after it.
        tlKeys.innerHTML = keyframes
          .map(
            (k) => `<div class="tlKey">
              ${
                k.fixed
                  ? `<span class="fixed">${k.fixed} (${k.time}s)</span>`
                  : `<input type="number" min="0" max="${tlLength}" step="0.1" value="${k.time}"
                      onchange="updateKeyframe(${k.id}, 'time', this.value)" /> s`
              }
              <input type="color" value="${k.color}"
                onchange="updateKeyframe(${k.id}, 'color', this.value)" />
              ${
                k.fixed === "end"
                  ? ""
                  : `<select onchange="updateKeyframe(${k.id}, 'anim', this.value)">
                      ${animations.map((name, i) => `<option value="${i}" ${i === k.anim ? "selected" : ""}>${name}</option>`).join("")}
                    </select>`
              }
              ${k.fixed ? "" : `<button onclick="removeKeyframe(${k.id})">✕</button>`}
            </div>`,
          )
          .join("");
      }

      // New keyframes take the color the gradient already has at that time,
      // so adding one doesn't change what the strip does until you edit it
      function addKeyframe(time, anim = 0) {
        const color = colorAt(time);
        keyframes.push({ id: nextKeyId++, time, anim, color });
        renderTimeline();
      }

      function updateKeyframe(id, field, value) {
        const k = keyframes.find((k) => k.id === id);
        if (!k) return;
        if (field === "time") {
          if (k.fixed) return;
          k.time = Math.min(tlLength, Math.max(0, parseFloat(value) || 0));
        } else if (field === "anim") {
          k.anim = parseInt(value);
        } else if (field === "color") {
          k.color = value;
        }
        renderTimeline();
      }

      function removeKeyframe(id) {
        keyframes = keyframes.filter((k) => k.id !== id || k.fixed);
        renderTimeline();
      }

      function setTimelineLength(seconds) {
        tlLength = Math.max(1, parseFloat(seconds) || 1);
        tlLengthInput.value = tlLength;
        // The end keyframe follows the new length; anything past it is pulled back
        for (const k of keyframes) {
          k.time = k.fixed === "end" ? tlLength : Math.min(k.time, tlLength);
        }
        renderTimeline();
      }

      // Click on the bar -> new keyframe at that time
      tlBar.addEventListener("click", (ev) => {
        const rect = tlBar.getBoundingClientRect();
        const t = ((ev.clientX - rect.left) / rect.width) * tlLength;
        addKeyframe(Math.round(t * 10) / 10);
      });

      tlLengthInput.addEventListener("change", (ev) =>
        setTimelineLength(ev.target.value),
      );

      renderTimeline(); // show the pinned start/end keyframes right away

      // A pass begins by turning on the light, snapping to the start keyframe's
      // color, so the first segment fades from exactly where the gradient says it should
      function startPass() {
        sendValue(1);
        tlNext = 0;
        sendFill(keyframes[0].color, 0);
      }

      function playTimeline() {
        sortKeyframes();
        tlPlaying = true;
        tlStart = performance.now();
        startPass();
        tlPlayBtn.disabled = true;
        tlStopBtn.disabled = false;
        tlRaf = requestAnimationFrame(tickTimeline);
      }

      function stopTimeline() {
        if (!tlPlaying) return;
        tlPlaying = false;
        cancelAnimationFrame(tlRaf);
        tlHead.style.left = "0%";
        tlPlayBtn.disabled = !animCharacteristic;
        tlStopBtn.disabled = true;
      }

      function tickTimeline(now) {
        if (!tlPlaying) return;
        let elapsed = (now - tlStart) / 1000;

        // Fire every segment whose start has passed: tell the ESP32 to fade to
        // the NEXT keyframe's color over the segment, running this one's animation.
        // The end keyframe starts no segment, so it never fires.
        while (tlNext < keyframes.length - 1 && keyframes[tlNext].time <= elapsed) {
          const k = keyframes[tlNext];
          const next = keyframes[tlNext + 1];
          sendFill(next.color, (next.time - k.time) * 1000);
          sendAnim(k.anim);
          tlNext++;
        }

        if (elapsed >= tlLength) {
          if (tlLoop.checked) {
            tlStart += tlLength * 1000;
            startPass();
            elapsed -= tlLength;
          } else {
            stopTimeline();
            return;
          }
        }

        tlHead.style.left = `${(elapsed / tlLength) * 100}%`;
        tlRaf = requestAnimationFrame(tickTimeline);
      }

      tlPlayBtn.addEventListener("click", playTimeline);
      tlStopBtn.addEventListener("click", stopTimeline);

      onBtn.addEventListener("click", () => sendValue(1));
      offBtn.addEventListener("click", () => sendValue(0));
    </script>
  </body>
</html>
